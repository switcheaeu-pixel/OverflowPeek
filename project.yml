name: OverflowPeek
options:
  bundleIdPrefix: com.overflowpeek
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: OverflowPeek
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    INFOPLIST_FILE: Info.plist

targets:
  OverflowPeek:
    type: application
    platform: macOS
    sources:
      - path: Sources/OverflowPeek
        excludes:
          - "*.md"
          - "*.sh"
    resources:
      - path: Sources/OverflowPeek/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overflowpeek.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_FILE: Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleName: OverflowPeek
        CFBundleDisplayName: Overflow Peek
        CFBundleIdentifier: com.overflowpeek.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: OverflowPeek
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSUIElement: true